<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#04243f">
<title>海ドロップ</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;overflow:hidden;background:#0a4f93;color:#fff;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;touch-action:none;overscroll-behavior:none}
  /* 画面いっぱいに使う。ノッチ・ダイナミックアイランド・ホームバーは端末が返す safe-area 分だけ避ける */
  #app{position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;height:var(--app-h,100dvh);
    background:#021526;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}
  /* ゲームウィンドウ。--u = ワールド座標1あたりのCSS px（resize() で設定） */
  #frame{position:relative;overflow:hidden;--u:1px}
  canvas{display:block}
  #hud{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*64);pointer-events:none;
    display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*6);padding:0 calc(var(--u)*10);
    background:linear-gradient(rgba(0,18,40,.55),rgba(0,18,40,0))}
  .box{background:rgba(0,25,55,.5);border:1px solid rgba(255,255,255,.28);border-radius:calc(var(--u)*14);
    padding:calc(var(--u)*3) calc(var(--u)*10);text-align:center;min-width:calc(var(--u)*84);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .lbl{font-size:calc(var(--u)*10);opacity:.8;letter-spacing:.1em}
  .val{font-size:calc(var(--u)*22);font-weight:bold;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  #next{height:calc(var(--u)*27);display:flex;align-items:center;justify-content:center}
  #next img{width:calc(var(--u)*27);height:calc(var(--u)*27)}
  .ib{pointer-events:auto;width:calc(var(--u)*40);height:calc(var(--u)*40);border-radius:50%;border:1px solid rgba(255,255,255,.35);
    background:rgba(0,25,55,.5);color:#fff;font-size:calc(var(--u)*19);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  /* 進化の順番：ゲームウィンドウ最下部（砂地の帯）に重ねる */
  #chain{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*30);pointer-events:none;
    display:flex;justify-content:center;align-items:center;gap:1px;background:rgba(0,20,45,.45)}
  #chain img{width:calc(var(--u)*24);height:calc(var(--u)*24)}
  #chain span.a{opacity:.5;font-size:calc(var(--u)*10)}
  .ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,20,40,.72);z-index:10;backdrop-filter:blur(3px)}
  .ov.hide{display:none}
  .card{background:linear-gradient(#0e4d7a,#073256);border:2px solid rgba(160,220,255,.5);border-radius:22px;padding:26px 24px;width:min(86vw,340px);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .card h1{font-size:34px;margin-bottom:6px;text-shadow:0 3px 0 #04243f}
  .card p{font-size:14px;line-height:1.7;opacity:.9;margin:8px 0}
  .card .big{font-size:44px;font-weight:bold;margin:6px 0}
  .btn{margin-top:14px;font-size:20px;font-weight:bold;padding:12px 36px;border-radius:40px;border:none;color:#04243f;
    background:linear-gradient(#bff4ff,#5fd3f3);box-shadow:0 4px 0 #1d7ea0}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1d7ea0}
  .row{font-size:24px;letter-spacing:2px;margin:6px 0}
  /* ===== リザルト画面：アニメ背景の上に得点とボタン ===== */
  #over{position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;height:var(--app-h,100dvh);
    z-index:10;overflow:hidden;background:#3b1d5e}
  #over.hide{display:none}
  #resPoster,#resAnim{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 40%}
  #resAnim{opacity:0;transition:opacity .6s}
  #resAnim.ready{opacity:1}
  #resShade{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(rgba(40,10,70,.6),rgba(40,10,70,0) 36%,rgba(40,10,70,0) 62%,rgba(30,5,50,.7))}
  #resTop{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 18px);text-align:center;
    padding:12px 14px 10px;border-radius:22px;background:rgba(45,15,80,.42);border:1.5px solid rgba(255,255,255,.35);
    box-shadow:0 8px 30px rgba(40,0,60,.35);opacity:0;transform:translateY(-24px)}
  #resLabel{font-size:14px;font-weight:bold;letter-spacing:.35em;color:#ffe9a8;text-shadow:0 2px 6px rgba(80,0,60,.7)}
  #resScoreRow{line-height:1;margin:4px 0 2px}
  #finalScore{font-size:60px;font-weight:900;color:#fff;
    text-shadow:0 0 12px rgba(255,120,200,.9),0 3px 0 #b1306f,0 5px 10px rgba(60,0,40,.6)}
  #resUnit{font-size:24px;font-weight:900;color:#ffe066;margin-left:4px;text-shadow:0 2px 0 #9a4a00}
  #new{color:#ffe066;font-weight:bold;display:none;font-size:16px;margin:4px 0;text-shadow:0 2px 4px rgba(0,0,0,.6);
    animation:resBlink 1s ease-in-out infinite}
  @keyframes resBlink{50%{opacity:.55}}
  #maxLv{font-size:14px;margin:4px 0 0;text-shadow:0 1px 3px rgba(0,0,0,.8)}
  #maxLv img{width:28px;height:28px;vertical-align:middle}
  #resBottom{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 22px);
    display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;transform:translateY(24px)}
  #retryBtn{margin:0;font-size:24px;padding:14px 56px;letter-spacing:.1em;color:#6b1f4f;
    background:linear-gradient(#fff3fb,#ff9ed6);box-shadow:0 5px 0 #c2508f,0 0 22px rgba(255,160,220,.8)}
  #retryBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #c2508f}
  #toTitleBtn{font-size:15px;font-weight:bold;color:#fff;background:rgba(50,15,80,.5);border:1.5px solid rgba(255,255,255,.7);
    border-radius:24px;padding:8px 26px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  #over.show #resTop{animation:resIn .5s cubic-bezier(.2,1.4,.4,1) forwards}
  #over.show #resBottom{animation:resIn .5s .7s ease-out forwards}
  @keyframes resIn{to{opacity:1;transform:none}}
  /* ===== タイトル画面 ===== */
  #title{position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;height:var(--app-h,100dvh);
    z-index:9;overflow:hidden;background:#0a4f93}
  #title.hide{display:none}
  #titleBg{position:absolute;inset:-30px;background:url(img/title.jpg) center/cover;filter:blur(18px) brightness(.85);transform:scale(1.1)}
  #titleInner{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:max(env(safe-area-inset-top),44px) 0 max(env(safe-area-inset-bottom),16px)}
  #titleArt{display:block;flex:0 1 auto;min-height:0;width:100%;max-width:520px;height:auto;object-fit:contain;
    box-shadow:0 12px 40px rgba(0,30,70,.55);animation:tFloat 4s ease-in-out infinite}
  @keyframes tFloat{50%{transform:translateY(-6px)}}
  #titleUi{flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:-34px;padding-bottom:12px;position:relative}
  #startBtn{font-size:26px;padding:14px 54px;letter-spacing:.15em;animation:tPulse 1.6s ease-in-out infinite;
    background:linear-gradient(#fff6a8,#ffc93c);color:#6b2a00;box-shadow:0 5px 0 #c77a00,0 0 24px rgba(255,220,90,.7)}
  #startBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #c77a00}
  @keyframes tPulse{50%{transform:scale(1.06)}}
  #titleSub{display:flex;align-items:center;gap:14px;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  #howBtn{font-size:14px;color:#fff;background:rgba(0,40,90,.55);border:1px solid rgba(255,255,255,.5);border-radius:20px;padding:6px 16px}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><div id="frame">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="box"><div class="lbl">スコア</div><div class="val" id="score">0</div></div>
      <div class="box"><div class="lbl">ネクスト</div><div id="next"></div></div>
      <div class="box"><div class="lbl">ベスト</div><div class="val" id="best">0</div></div>
      <button class="ib" id="snd">🔊</button>
    </div>
    <div id="chain"></div>
  </div></div>
</div>

<div id="title">
  <div id="titleBg"></div>
  <div id="titleInner">
    <img id="titleArt" src="img/title.jpg" alt="海ドロップ">
    <div id="titleUi">
      <button class="btn" id="startBtn">スタート</button>
      <div id="titleSub">
        <span id="titleBest"></span>
        <button id="howBtn">遊び方</button>
      </div>
    </div>
  </div>
  <div class="ov hide" id="how">
    <div class="card">
      <h1 style="font-size:26px">遊び方</h1>
      <p>同じ生き物どうしをくっつけると<br>大きな生き物に進化するよ！<br>サメを目指そう🦈</p>
      <div class="row" id="titleChain"></div>
      <p style="font-size:12px;opacity:.7">画面をなぞって位置を決め、指をはなすと落ちるよ<br>赤い線より上に積み上がるとゲームオーバー</p>
      <button class="btn" id="howClose">とじる</button>
    </div>
  </div>
</div>

<div class="hide" id="over">
  <img id="resPoster" alt="">
  <img id="resAnim" alt="">
  <div id="resShade"></div>
  <div id="resTop">
    <div id="resLabel">RESULT</div>
    <div id="resScoreRow"><span id="finalScore">0</span><span id="resUnit">点</span></div>
    <p id="new">🎉 ベストスコア更新！</p>
    <p id="maxLv"></p>
  </div>
  <div id="resBottom">
    <button class="btn" id="retryBtn">もう一度</button>
    <button id="toTitleBtn">タイトルへ</button>
  </div>
</div>

<script>
(() => {
'use strict';
// ===== 生き物データ =====
const KINDS = [
  { f:'00-ebi',        n:'エビ',             r:15,  c:'#b46be0' },
  { f:'01-neon',       n:'ネオンテトラ',     r:20,  c:'#f26bc8' },
  { f:'02-kumanomi',   n:'クマノミ',         r:26,  c:'#35c07a' },
  { f:'03-chocho',     n:'チョウチョウウオ', r:33,  c:'#4cc9e0' },
  { f:'04-tsunodashi', n:'ツノダシ',         r:40,  c:'#e8384a' },
  { f:'05-tai',        n:'タイ',             r:48,  c:'#ff9a2e' },
  { f:'06-unagi',      n:'ウナギ',           r:57,  c:'#f5b52a' },
  { f:'07-tako',       n:'タコ',             r:67,  c:'#6a5ee0' },
  { f:'08-maguro',     n:'マグロ',           r:78,  c:'#f5d31c' },
  { f:'09-umigame',    n:'ウミガメ',         r:90,  c:'#8fe0d0' },
  { f:'10-same',       n:'サメ',             r:104, c:'#3a8ef0' },
];
// ===== 画像の遅延読み込み =====
// アプリ内ブラウザにはページの読み込み完了（画像を含む）まで画面を出さないものがあるため、
// タイトル画像以外は読み込み完了の後で読み込み始める。未読込の間は代わりの描画で動く。
const lazyImgs = [];
function lazyImage(src) { const im = new Image(); lazyImgs.push([im, src]); return im; }
const afterLoad = []; // 読み込み完了後に行う処理（画像つきの表示など）
function loadLazyImages() { for (const [im, src] of lazyImgs) if (!im.src) im.src = src; afterLoad.forEach(f => f()); afterLoad.length = 0; }
if (document.readyState === 'complete') setTimeout(loadLazyImages, 0);
else window.addEventListener('load', () => setTimeout(loadLazyImages, 0));

for (const k of KINDS) {
  k.src = `balls/${k.f}.webp`; k.img = lazyImage(k.src);
  k.simg = lazyImage(`balls/${k.f}-s.webp`); // 驚いた顔（合体して消える瞬間用）
}
const kImg = (k, px) => `<img src="${k.src}" alt="${k.n}" width="${px}" height="${px}" style="vertical-align:middle">`;
const MAX = KINDS.length - 1;
const DROP_MAX = 4; // 落とせるのはフグまで

// ===== ワールド =====
const HUD_H = 64;                 // ゲームウィンドウ上部のスコア表示帯の高さ
// 横幅400は固定し、縦は端末の画面比率に合わせて伸縮（iPhoneの機種ごとに画面いっぱいになる）
const W = 400, CHAIN_H = 30;
let H = 680 + HUD_H, FLOOR = H - CHAIN_H;
const DROP_Y = 62 + HUD_H, LINE_Y0 = 112 + HUD_H;
const GRAV = 560;        // 浮力で弱めた重力
const DRAG = 1.7;        // 水の抵抗（1秒あたりの減衰率）→ 終端速度 ≒ GRAV/DRAG
const BOUNCE = .38;      // 跳ね返り係数（水中なのでふんわり）
const SWAY = 55;         // 沈むときの左右ゆらぎの強さ
// 演出モードごとの物理（g:重力 drag:水の抵抗 sway:ゆらぎ e:反発 th:跳ね始める速度 fr:接線摩擦）
const PHYS = {
  normal:   { g: GRAV, drag: DRAG, sway: SWAY, e: BOUNCE, th: 45, fr: .05 },
  deep: { g: 1600, drag: .05,  sway: 0,    e: BOUNCE, th: 45, fr: .05 },  // 浮力なし：ストンと落ちる
  rush:   { g: 950,  drag: .12,  sway: 0,    e: .94,    th: 8,  fr: .01 },  // スーパーボール
};
const DEEP_SEC = 9, RUSH_SEC = 7, RUSH_GRACE = 3.5; // 演出の長さ・群泳ラッシュ後のゲームオーバー猶予
const SHINE_SEC = 6;         // シャインタイムの長さ（秒）
const SHINE_DROP_MAX = 2;    // シャインタイム中に落ちてくる球（0:エビ〜2:クマノミ）
const SHINE_BALL_FADE = .55; // シャインタイム中の球の透け具合（0=透けない〜1=見えない）
const shineImg = lazyImage('img/shine.webp');
// ===== 特別演出の抽選：球を1つ落とすごとに抽選 =====
//   深潮・シャインタイムは 1ゲームに1回前後、群泳ラッシュは数ゲームに1回のレア演出。
//   イワシの群れは通常モードのまま背景を横切るだけの演出。
const EFFECT_ODDS = {          // 1/n の n
  deep: 120,               // 深潮（ディープカレント）
  shine:   120,               // シャインタイム
  rush:   960,               // 群泳ラッシュ（スーパーボール）
  iwashi:   960,               // イワシの群れが通るだけ
};
const EFFECT_RATE_SCALE = 1;   // 出現率の倍率（2 で2倍出やすく）
let mode = null, graceT = 0, ki = 0, shakeT = 0;
function effectLottery() {
  if (!running || mode) return;          // 演出中は抽選しない
  let r = Math.random();
  for (const k in EFFECT_ODDS) {
    const p = EFFECT_RATE_SCALE / EFFECT_ODDS[k];
    if (r < p) { if (k === 'iwashi') fishSchool(false); else startMode(k); return; }
    r -= p;
  }
}
const curPhys = () => PHYS[mode ? mode.k : 'normal'] || PHYS.normal; // シャインタイムは通常の物理

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let scale = 1, dpr = 1;

function resize() {
  const st = document.getElementById('stage');
  const aw = st.clientWidth, ah = st.clientHeight;
  if (!(aw > 0 && ah > 0)) return; // まだ画面の大きさが決まっていない（アプリ内ブラウザの起動直後など）
  H = Math.round(Math.max(620, Math.min(1100, W * ah / aw)));
  FLOOR = H - CHAIN_H;
  scale = Math.min(aw / W, ah / H);
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = (W * scale) + 'px';
  cv.style.height = (H * scale) + 'px';
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  document.getElementById('frame').style.setProperty('--u', scale + 'px');
}
// ===== 画面サイズの監視 =====
// アプリ内ブラウザでは、大きさ0のままページを読み込み、その後サイズ変更の通知が来ないことがある。
// 実際の高さを --app-h に設定し、起動直後は一定間隔で測り直して変化があれば表示をやり直す。
let lastVW = -1, lastVH = -1;
function fitViewport() {
  const vw = window.innerWidth || document.documentElement.clientWidth;
  const vh = window.innerHeight || document.documentElement.clientHeight;
  // 200px 未満は表示前の仮の大きさとみなして使わない
  if (vw >= 200 && vh >= 200 && (vw !== lastVW || vh !== lastVH)) {
    lastVW = vw; lastVH = vh;
    document.documentElement.style.setProperty('--app-h', vh + 'px');
    resize();
  }
}
['resize', 'orientationchange', 'pageshow', 'focus'].forEach(ev => window.addEventListener(ev, fitViewport));
document.addEventListener('visibilitychange', () => { if (!document.hidden) fitViewport(); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitViewport);
if (window.ResizeObserver) new ResizeObserver(fitViewport).observe(document.documentElement);
{ // 起動から5秒間は 0.25秒ごと、その後は1秒ごとに測り直す（変化が無ければ何もしない軽い処理）
  let n = 0; const id = setInterval(() => { fitViewport(); if (++n >= 20) { clearInterval(id); setInterval(fitViewport, 1000); } }, 250);
}

// ===== 状態 =====
let balls = [], parts = [], pops = [], ghosts = [];
let score = 0, best = 0, maxLv = 0;
let cur = 0, nxt = 0, dropX = W / 2;
let canDrop = true, dropCool = 0;
let running = false, dangerT = 0, time = 0;
let uid = 0;
try { best = +localStorage.getItem('umiDropBest') || 0; } catch (e) {}

const $ = id => document.getElementById(id);
// ===== 難易度 =====
// D = 基本1 ＋ 5000点ごとに+1（段階）＋ 投下数に合わせた波（0〜1、30投下で1周）
const DIFF_STEP = 5000, DIFF_WAVE = 30;
let drops = 0, recentX = [], diffStep = 0;
const diffWave = () => (1 - Math.cos(2 * Math.PI * drops / DIFF_WAVE)) / 2;
const difficulty = () => 1 + diffStep + diffWave();
// ボーダーラインは段階ごとに 8 ずつ下がる（最大 48）
const lineY = () => LINE_Y0 + Math.min(48, diffStep * 8);
// 線を越えてからゲームオーバーまでの猶予（1.8秒→段階ごとに -0.1、最短1.2秒）
// 線を越えた球が止まってから、ゲームオーバー確定までの時間（段階ごとに短く）
const REST_SPEED = 20;
const dangerLimit = () => Math.max(.3, .8 - diffStep * .1);
let overLine = false;
// 同じ場所ばかりに落としているか（直近8投下が 50px 幅の区画 2つ以内）
function monotony() {
  if (recentX.length < 8) return 0;
  return new Set(recentX.map(x => x / 50 | 0)).size <= 2 ? 1 : 0;
}
// 盤面の「上に何も乗っていない」球の種類（＝次に合わせやすい球）
function exposedKinds() {
  const set = new Set();
  for (const b of balls) {
    if (b.dead || b.age < .5) continue;
    const covered = balls.some(o => o !== b && o.y < b.y - b.r * .5 && Math.abs(o.x - b.x) < (o.r + b.r) * .8);
    if (!covered) set.add(b.lv);
  }
  return set;
}
// 出てくる球を決める：同じ球が3個以上続かないよう、直前2個と同じなら引き直す
let dealt = [];
function randKind() {
  let k = pickKind();
  const n = dealt.length;
  if (n >= 2 && dealt[n - 1] === k && dealt[n - 2] === k) {
    for (let i = 0; i < 20 && k === dealt[n - 1]; i++) k = pickKind();
    if (k === dealt[n - 1]) k = k > 0 ? k - 1 : 1; // それでも同じなら隣の種類に
  }
  dealt.push(k); if (dealt.length > 2) dealt.shift();
  return k;
}
// 小さい方から5番目（ツノダシ）以降は出にくくする
const BIG_RARE = 4, BIG_KEEP = .3; // 意地悪制御でも5番目を渡すのは3割だけ
function pickKind() {
  const shine = mode && mode.k === 'shine';
  const mx = shine ? SHINE_DROP_MAX : DROP_MAX;
  const D = difficulty(), t = Math.min(1, D / 6);
  // 易しい：小さい球が出やすい ⇔ 難しい：大きめの球が増える
  const easy = [32, 28, 22, 14, 4], hard = [16, 20, 26, 28, 10];
  const w = easy.map((e, i) => e + (hard[i] - e) * t).slice(0, mx + 1);

const SE_OFS = { awa05: .075, awa06: .08 }; // 頭の無音を飛ばす
const seBuf = {};
function loadSE() {
  for (const k in SE_DATA) {
    const bin = atob(SE_DATA[k]), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    try {
      const r = actx.decodeAudioData(u8.buffer, b => { seBuf[k] = b; }, err => console.warn('SE decode failed', k, err));
      if (r && r.catch) r.catch(() => {});
    } catch (e) { console.warn('SE decode error', k, e); }

function playSE(k, vol = 1, rate = 1, maxDur = 0) {

  g.gain.setValueAtTime(vol, t);

let touching = false;

function drop() {

}
function sparkle(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, sp = 60 + Math.random() * 160;
    parts.push({ k: 'star', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 3 + Math.random() * 4, life: 0, max: .6 + Math.random() * .4 });
  }
}
// キャラの出入り（0=画面下に隠れている, 1=定位置）
function shineRise() {
  if (!mode || mode.k !== 'shine') return 0;
  const inn = Math.min(1, mode.t / 1.3), out = Math.min(1, (mode.dur - mode.t) / 1.0);
  const e = 1 - Math.pow(1 - inn, 3);
  return Math.max(0, Math.min(e, out * out));
}
function drawShine() {
  const r = shineRise(); if (r <= 0) return;
  const im = shineImg; if (!im.complete || !im.naturalWidth) return;
  const baseY = lineY();                                        // 定位置：頭のてっぺんがボーダーラインに届く
  const dh = H + 40 - baseY, dw = dh * im.naturalWidth / im.naturalHeight; // 足元は画面下で切れる
  const y = baseY + (1 - r) * (dh + 40) + Math.sin(time * 1.8) * 5; // 下からせり上がる
  const cx = W / 2, gy = y + dh * .35;
  ctx.save();
  // 後光
  ctx.globalAlpha = r * .9;
  const g = ctx.createRadialGradient(cx, gy, 20, cx, gy, 260);
  g.addColorStop(0, 'rgba(255,240,200,.75)'); g.addColorStop(.45, 'rgba(255,170,210,.35)'); g.addColorStop(1, 'rgba(255,170,210,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 回転する光の筋
  ctx.save(); ctx.translate(cx, gy); ctx.rotate(time * .35);
  ctx.fillStyle = 'rgba(255,245,220,.16)';
  for (let i = 0; i < 12; i++) {
    ctx.rotate(Math.PI / 6);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-18, -300); ctx.lineTo(18, -300); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // キャラ
  ctx.globalAlpha = Math.min(1, r * 1.5);
  ctx.drawImage(im, cx - dw / 2, y, dw, dh);
  // きらきら
  for (let i = 0; i < 16; i++) {
    const a = i * 2.39996 + time * .6, d = 90 + (i * 37 % 120);
    const sx = cx + Math.cos(a) * d * 1.1, sy = gy + Math.sin(a) * d * 1.3;
    const tw = (Math.sin(time * 5 + i * 1.7) + 1) / 2;
    drawStar(sx, sy, 3 + tw * 5, r * tw);
  }
  ctx.restore();
}
function drawStar(x, y, s, a) {
  if (a <= .02) return;
  ctx.globalAlpha = a; ctx.fillStyle = '#fffbe6';
  ctx.beginPath(); ctx.moveTo(x, y - s); ctx.quadraticCurveTo(x, y, x + s, y); ctx.quadraticCurveTo(x, y, x, y + s);
  ctx.quadraticCurveTo(x, y, x - s, y); ctx.quadraticCurveTo(x, y, x, y - s); ctx.fill();
}
// 深潮の流れの筋
let streaks = [];
function newStreak(init) {
  const band = Math.random() < .7;
  const cy = HUD_H + (FLOOR - HUD_H) * .45;
  return { x: init ? Math.random() * W : -Math.random() * 300, y: band ? cy + (Math.random() - .5) * 260 : HUD_H + Math.random() * (FLOOR - HUD_H),
    len: 60 + Math.random() * 200, sp: 550 + Math.random() * 650, w: .8 + Math.random() * 2.2, a: .25 + Math.random() * .5, ph: Math.random() * 6 };
}
function updStreaks(dt) {
  if (ki <= 0) { streaks.length = 0; return; }
  while (streaks.length < 55) streaks.push(newStreak(streaks.length < 30));
  for (let i = 0; i < streaks.length; i++) {
    const s = streaks[i]; s.x += s.sp * dt;
    if (s.x - s.len > W) streaks[i] = newStreak(false);
  }
}
function drawDeep() {
  if (ki <= 0) return;
  const cy = HUD_H + (FLOOR - HUD_H) * .45;
  ctx.save();
  // 海が一気に深い藍色へ
  ctx.globalAlpha = ki * .22; ctx.fillStyle = '#00081e'; ctx.fillRect(0, 0, W, H);
  // 深潮の本流：うねりながら画面を横切る帯
  ctx.globalAlpha = ki;
  const g = ctx.createLinearGradient(0, cy - 170, 0, cy + 170);
  g.addColorStop(0, 'rgba(10,50,130,0)'); g.addColorStop(.28, 'rgba(15,80,180,.2)');
  g.addColorStop(.5, 'rgba(50,150,255,.28)'); g.addColorStop(.72, 'rgba(15,80,180,.2)'); g.addColorStop(1, 'rgba(10,50,130,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 10) ctx.lineTo(x, cy - 135 + Math.sin(x * .02 - time * 6) * 20);
  for (let x = W; x >= 0; x -= 10) ctx.lineTo(x, cy + 135 + Math.sin(x * .025 - time * 5 + 1) * 20);
  ctx.closePath(); ctx.fill();
  // 帯の中を流れる白いうねり
  ctx.lineWidth = 2;
  for (let k = 0; k < 6; k++) {
    ctx.strokeStyle = `rgba(190,235,255,${.12 + .1 * (k % 2)})`;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 8) ctx.lineTo(x, cy - 100 + k * 40 + Math.sin(x * .03 - time * 10 + k * 1.3) * 9);
    ctx.stroke();
  }
  // 高速で流れる筋
  ctx.lineCap = 'round';
  for (const s of streaks) {
    const y = s.y + Math.sin(s.x * .02 + s.ph) * 6;
    const lg = ctx.createLinearGradient(s.x - s.len, 0, s.x, 0);
    lg.addColorStop(0, 'rgba(160,225,255,0)'); lg.addColorStop(1, `rgba(220,245,255,${s.a})`);
    ctx.strokeStyle = lg; ctx.lineWidth = s.w;
    ctx.beginPath(); ctx.moveTo(s.x - s.len, y); ctx.lineTo(s.x, y); ctx.stroke();
  }
  // 周囲を暗く絞る
  const v = ctx.createRadialGradient(W / 2, cy, 120, W / 2, cy, H * .75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,4,16,.35)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

// ===== 描画 =====
function drawBg() {
  ctx.fillStyle = '#063456'; ctx.fillRect(0, 0, W, H);
  drawImgCover(bgImgs[bgFrom], 1);
  drawImgCover(bgImgs[bgTo], bgFade);
  // 生き物が見やすいよう軽く暗くする
  ctx.fillStyle = 'rgba(0,15,35,.18)'; ctx.fillRect(0, 0, W, H);
  drawFishes();
  drawDeep();
  drawShine();
  // 床の目安
  ctx.fillStyle = 'rgba(255,240,210,.18)'; ctx.fillRect(0, FLOOR, W, H - FLOOR);
  // 泡
  ctx.fillStyle = 'rgba(220,245,255,.35)';
  for (const b of bgBubbles) {
    ctx.beginPath(); ctx.arc(b.x + Math.sin(time * 2 + b.ph) * 3, b.y, b.r, 0, 7); ctx.fill();
  }
}

function drawGhosts() {
  for (const g of ghosts) {
    const k = KINDS[g.lv], im = k.simg.complete && k.simg.naturalWidth ? k.simg : k.img;
    let x = g.x, y = g.y, sc, al;
    if (g.t < SURPRISE_HOLD) {                       // びっくり：ぷくっと膨らんで小刻みに震える
      const u = g.t / SURPRISE_HOLD;
      sc = 1 + .12 * Math.sin(Math.min(1, u * 2) * Math.PI / 2);
      x += Math.sin(g.t * 90) * 1.5; al = 1;
    } else {                                          // 合体場所へ吸い込まれて消える
      const u = (g.t - SURPRISE_HOLD) / SURPRISE_OUT, e = u * u;
      x += (g.tx - x) * e; y += (g.ty - y) * e; sc = 1.12 - .5 * e; al = 1 - e;
    }
    const r = g.r * sc;
    ctx.save(); ctx.globalAlpha = al * (1 - SHINE_BALL_FADE * shineRise());
    ctx.drawImage(im, x - r, y - r, r * 2, r * 2); ctx.restore();
  }
}
function drawBall(b, alpha = 1) {
  const k = KINDS[b.lv], r = b.r;
  // シャインタイム中は球を透かして、後ろのキャラが見えるようにする
  ctx.save(); ctx.globalAlpha = alpha * (1 - SHINE_BALL_FADE * shineRise()); ctx.translate(b.x, b.y);
  if (k.img.complete && k.img.naturalWidth) {
    // 絵のハイライトが崩れないよう、キャラは回転させず正立で描く
    // 水中でふわっと傾き、ぶつかるとぷるんと揺れる
    if (b.vx !== undefined) {
      ctx.rotate(Math.max(-.14, Math.min(.14, b.vx / 700)) + Math.sin((b.age || 0) * 1.7 + (b.ph || 0)) * .025);
      const w = (b.wob || 0) * Math.sin((b.wt || 0) * 22) * Math.exp(-(b.wt || 0) * 5);
      ctx.scale(1 + w, 1 - w);
    }
    ctx.drawImage(k.img, -r, -r, r * 2, r * 2);
  } else {
    ctx.fillStyle = k.c; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function draw() {
  const sh = shakeT > 0 ? shakeT * 10 : 0;
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, (Math.random() - .5) * sh * scale * dpr, (Math.random() - .5) * sh * scale * dpr);
  drawBg();
  // デッドライン
  const danger = overLine && running; // 線を越えた球がある間は点滅して警告
  ctx.save();
  ctx.setLineDash([10, 8]); ctx.lineWidth = 2;
  ctx.strokeStyle = danger ? `rgba(255,60,60,${.5 + .5 * Math.sin(time * 14)})` : 'rgba(255,120,120,.45)';
  ctx.beginPath(); ctx.moveTo(0, lineY()); ctx.lineTo(W, lineY()); ctx.stroke();
  ctx.restore();
  // ガイド線と待機中の生き物
  if (running) {
    const r = KINDS[cur].r;
    ctx.save(); ctx.setLineDash([4, 8]); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(dropX, DROP_Y + r); ctx.lineTo(dropX, FLOOR); ctx.stroke(); ctx.restore();
    // 小さな潜水艇（ドロッパー）
    ctx.save(); ctx.translate(dropX, HUD_H + 16);
    ctx.fillStyle = '#ffd24a'; ctx.beginPath(); ctx.ellipse(0, 0, 22, 11, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#9fe3ff'; ctx.beginPath(); ctx.arc(6, -1, 5, 0, 7); ctx.fill();
    ctx.fillStyle = '#e0a800'; ctx.fillRect(-4, -17, 5, 7); ctx.restore();
    drawBall({ lv: cur, x: dropX, y: DROP_Y, r, a: 0 }, canDrop ? 1 : .35);
  }
  for (const b of balls) {
    if (b.shine && mode && mode.k === 'shine') {
      ctx.save(); ctx.globalAlpha = .55 + .35 * Math.sin(time * 8);
      ctx.strokeStyle = '#ffd6f0'; ctx.lineWidth = 4; ctx.shadowColor = '#ff7ac8'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 3, 0, 7); ctx.stroke(); ctx.restore();
    }
    drawBall(b);
  }
  // パーティクル
  drawGhosts();
  drawParts();
  // スコアポップ
  ctx.textAlign = 'center';
  for (const p of pops) {
    ctx.font = p.big ? 'bold 34px sans-serif' : 'bold 22px sans-serif';
    ctx.globalAlpha = Math.max(0, Math.min(1, 1 - p.t / 1));
    ctx.lineWidth = 4; ctx.strokeStyle = '#04243f'; ctx.strokeText(p.s, p.x, p.y - (p.big ? 0 : p.t * 40));
    ctx.fillStyle = '#ffe066'; ctx.fillText(p.s, p.x, p.y - (p.big ? 0 : p.t * 40));
  }
  ctx.globalAlpha = 1;
  drawBadge();
}

// 得点の節目のバッジ：ポンと飛び出してふわふわ浮かび、最後は少し大きくなりながら消える
function drawBadge() {
  if (!badge) return;
  const t = badge.t, im = BADGE_IMGS[badge.m];
  let sc;
  if (t < .18) sc = .3 + (t / .18) * .85;                 // 0.3 → 1.15
  else if (t < .34) sc = 1.15 - ((t - .18) / .16) * .15;  // 1.15 → 1.0
  else sc = 1;
  const out = Math.max(0, (t - (BADGE_SEC - .5)) / .5);    // 最後の0.5秒でフェード
  sc *= 1 + out * .15;
  const cx = W / 2, cy = H * .38 + Math.sin(t * 3) * 6;
  ctx.save();
  ctx.globalAlpha = 1 - out;
  ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.rotate(Math.sin(t * 2.2) * .03);
  if (im && im.complete && im.naturalWidth) {
    const w = W * .9, h = w * im.naturalHeight / im.naturalWidth;
    ctx.drawImage(im, -w / 2, -h / 2, w, h);
  } else {
    // 画像が無い節目（35000点以降など）は文字で描く
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 58px "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif';
    const g = ctx.createLinearGradient(0, -50, 0, 10);
    g.addColorStop(0, '#fff6b0'); g.addColorStop(.5, '#ffb627'); g.addColorStop(1, '#ff6a00');
    ctx.lineJoin = 'round'; ctx.lineWidth = 12; ctx.strokeStyle = '#3a1a00';
    ctx.strokeText(`${badge.m}点`, 0, -22); ctx.fillStyle = g; ctx.fillText(`${badge.m}点`, 0, -22);
    ctx.font = 'italic 900 44px "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif';
    const g2 = ctx.createLinearGradient(-80, 0, 80, 0);
    g2.addColorStop(0, '#ff5fd2'); g2.addColorStop(1, '#ffc94a');
    ctx.lineWidth = 10; ctx.strokeStyle = '#1b2a6b';
    ctx.strokeText('Over', 0, 30); ctx.fillStyle = g2; ctx.fillText('Over', 0, 30);
  }
  ctx.restore();
}

// ===== ループ =====
let last = 0;
function loop(ts) {
  const dt = Math.min(.033, (ts - last) / 1000 || 0); last = ts; time += dt;
  if (running) {
    physics(dt);
    for (const b of balls) b.age += dt;
    if (!canDrop) { dropCool -= dt; if (dropCool <= 0) canDrop = true; }
    // ゲームオーバー判定：線より上に留まり続けたら
    // 線を越えている球のうち、動きが止まっている球があればカウント。動いている間はゲームオーバーにしない
    const overs = balls.filter(b => b.age > 1.2 && b.y - b.r < lineY());
    overLine = overs.length > 0;
    const over = overs.some(b => b.touch && b.ms < REST_SPEED); // 何かに乗って、実際に止まっている
    // 群泳ラッシュ中と終了直後の猶予中は、線を越えてもゲームオーバーにしない
    const safe = (mode && mode.k === 'rush') || graceT > 0;
    dangerT = over && !safe ? dangerT + dt : 0;
    if (dangerT > dangerLimit()) gameOver();
    // 5000点ごとに難易度アップ
    const st = Math.floor(score / DIFF_STEP);
    if (st > diffStep) {
      diffStep = st;
      tone(220, 440, .4, 'sawtooth', .08); // 表示は得点の節目のバッジに任せる
    }
    playT += dt;
    if (goldT > 0) goldT -= dt;
    if (score >= nextGold) {
      let m = nextGold;
      while (score >= nextGold) { m = nextGold; nextGold += MS_STEP; } // 一気に越えた時は一番上の節目
      msBg = milestoneBg(m); goldT = GOLD_SEC;
      badge = { m, t: 0 };
      sparkle(W / 2, H * .38, 24);
      sBig(); fishParade();
    }
  }
  updMode(dt);
  updBg(dt);
  updFish(dt);
  updParts(dt);
  if (badge && (badge.t += dt) > BADGE_SEC) badge = null;
  for (const g of ghosts) g.t += dt;
  ghosts = ghosts.filter(g => g.t < SURPRISE_HOLD + SURPRISE_OUT);
  for (const p of pops) p.t += dt;
  pops = pops.filter(p => p.t < 1);
  for (let i = 0; i < bgBubbles.length; i++) {
    const b = bgBubbles[i]; b.y -= b.sp * dt; b.x += ki * 320 * dt; if (b.x > W + 10) b.x -= W + 20;
    if (b.y < -10) bgBubbles[i] = newBg(false);
  }
  draw();
  requestAnimationFrame(loop);
}

function gameOver() {
  running = false; touching = false; sOver();
  let isNew = false;
  if (score > best) { best = score; isNew = true; try { localStorage.setItem('umiDropBest', best); } catch (e) {} }
  updHud();
  $('finalScore').textContent = 0;
  $('new').style.display = isNew ? 'block' : 'none';
  $('maxLv').innerHTML = 'いちばん大きな生き物：' + kImg(KINDS[maxLv], 28) + ' ' + KINDS[maxLv].n;
  setTimeout(() => {
    const ov = $('over'); ov.classList.remove('show', 'hide'); void ov.offsetWidth; ov.classList.add('show');
    setTimeout(() => countUp($('finalScore'), score, 1200), 250);
  }, 600);

  // If this page is embedded (e.g. via <iframe> on a hosting/ranking site),
  // report the final score to the parent page via postMessage so it can be
  // recorded without that site needing any other access to this game.
  if (window.parent && window.parent !== window) {
    try { window.parent.postMessage({ type: 'gameOver', score: score }, '*'); }
    catch (e) { console.error('postMessage to parent failed', e); }
  }
}

// リザルト背景（アニメ約3MB）は初回のゲーム開始時に読み込み始める（起動時の表示を遅らせない）
let resLoading = false;
function loadResultBg() {
  if (resLoading) return; resLoading = true;
  $('resPoster').src = 'img/result-poster.webp';
  const a = $('resAnim'); a.onload = () => a.classList.add('ready'); a.src = 'img/result.webp';
}
// 得点を0から数え上げる
function countUp(el, to, ms) {
  const t0 = performance.now();
  const step = now => {
    const u = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - u, 3);
    el.textContent = Math.round(to * e);
    if (u < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function start() {
  lastVW = -1; fitViewport(); loadResultBg();
  audio(); reset(); running = true;
  $('title').classList.add('hide'); $('over').classList.add('hide');
}
$('startBtn').addEventListener('click', start);
$('toTitleBtn').addEventListener('click', () => {
  $('over').classList.add('hide'); $('title').classList.remove('hide');
  $('titleBest').textContent = best ? `ベスト ${best}` : '';
});
$('howBtn').addEventListener('click', () => $('how').classList.remove('hide'));
$('howClose').addEventListener('click', () => $('how').classList.add('hide'));
$('titleBest').textContent = best ? `ベスト ${best}` : '';
$('retryBtn').addEventListener('click', start);

// 進化チェーン表示
afterLoad.push(() => {
  $('chain').innerHTML = KINDS.map(k => kImg(k, 24)).join('<span class="a">›</span>');
  $('titleChain').innerHTML = KINDS.map(k => kImg(k, 24)).join('');
});

fitViewport(); resize(); reset(); requestAnimationFrame(loop);
})();
</script>
</body>
